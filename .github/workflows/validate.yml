name: Validate skills
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: |
          python skills/2d-character-animation/scripts/audit.py rig skills/2d-character-animation/assets/rig-contract.example.json
          python skills/2d-character-animation/scripts/audit.py trace skills/2d-character-animation/assets/motion-trace.example.json
